<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация аккаунта</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Регистрация аккаунта</h1>
        <p class="subtitle">Заполните форму для создания аккаунта</p>

        <form id="registrationForm">

            <!-- Логин -->
            <div class="field">
                <label for="login">Логин</label>

                <input
                    type="text"
                    id="login"
                    placeholder="Введите логин"
                >

                <span id="loginMessage" class="message"></span>
            </div>

            <!-- E-mail -->
            <div class="field">
                <label for="email">E-mail</label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@mail.com"
                >

                <span id="emailMessage" class="message"></span>
            </div>

            <!-- Пароль -->
            <div class="field">
                <label for="password">Пароль</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Минимум 8 символов"
                >

                <span id="passwordMessage" class="message"></span>

                <div class="password-indicator">
                    <div id="passwordBar"></div>
                </div>
            </div>

            <!-- Повтор пароля -->
            <div class="field">
                <label for="confirmPassword">Подтвердите пароль</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Повторите пароль"
                >

                <span id="confirmMessage" class="message"></span>
            </div>

            <button type="submit">Зарегистрироваться</button>

        </form>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
