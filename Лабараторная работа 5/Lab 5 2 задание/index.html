<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка возраста</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: pink;
        }

        .container {
            width: 350px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #d63384;
        }

        input {
            width: 90%;
            padding: 12px;
            margin-top: 10px;
            border: 2px solid #f3a6c8;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background-color: #d63384;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b82b70;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #d63384;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Проверка возраста</h1>

        <input
            type="number"
            id="age"
            placeholder="Введите возраст"
        >

        <button id="checkButton">
            Проверить
        </button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
