<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №5</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            color: #dc2626;
        }

        #card {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-left: 5px solid #2563eb;
            border-radius: 10px;
            display: none;
        }

        #card h2 {
            margin-top: 0;
        }

        .dark {
            background: #111827;
            color: white;
        }

        .dark .container {
            background: #1f2937;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Карточка студента</h1>

    <label for="name">Имя:</label>
    <input type="text" id="name" placeholder="Введите имя">

    <label for="group">Группа:</label>
    <input type="text" id="group" placeholder="Например, ИС-21">

    <label for="course">Курс:</label>
    <input type="number" id="course" min="1" max="6" placeholder="Введите курс">

    <button id="createBtn">Создать карточку</button>

    <button id="themeBtn">Сменить тему</button>

    <p id="message"></p>

    <div id="card">
        <h2 id="studentName"></h2>
        <p id="studentGroup"></p>
        <p id="studentCourse"></p>
        <p id="studentInfo"></p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
