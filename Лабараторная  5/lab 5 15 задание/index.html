<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Игра Угадай число</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background-color: #f0f0f0;
            padding-top: 50px;
        }

        .container {
            background-color: white;
            width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        input {
            padding: 10px;
            font-size: 18px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        #hint {
            font-size: 20px;
            font-weight: bold;
        }

        .dark {
            background-color: #222;
            color: white;
        }

        .dark .container {
            background-color: #444;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🎯 Угадай число</h1>

        <p>Я загадал число от 1 до 100.</p>

        <input
            type="number"
            id="guessInput"
            placeholder="Введите число"
            min="1"
            max="100"
        >

        <br>

        <button id="guessButton">Проверить</button>

        <button id="newGameButton">Новая игра</button>

        <button id="themeButton">🌙 Тема</button>

        <p id="hint">Введите число от 1 до 100</p>

        <p id="attempts">Количество попыток: 0</p>

        <p id="record">Рекорд: —</p>

    </div>

    <!-- Подключаем JavaScript -->
    <script src="script.js"></script>

</body>
</html>
